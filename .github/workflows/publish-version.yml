name: Update version.json on Stable Release Publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable tag
        required: true
permissions:
  contents: write
concurrency:
  group: stable-update-feed
  cancel-in-progress: false
jobs:
  update-version:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify live assets and update metadata
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: ./tools/PublishFeed.ps1 -Tag $env:RELEASE_TAG
      - name: Commit verified metadata
        shell: powershell
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add version.json
          git diff --staged --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m 'Update verified stable feed [skip ci]'
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'Feed push failed' }
